<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>FDE 智慧防沉迷數字健康與行為干預系統</title>
    <style>
        * { box-sizing: border-box; font-family: "微軟正黑體", sans-serif; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-section { text-align: center; margin-bottom: 10px; }
        h2 { margin: 0 0 4px 0; font-size: 20px; color: #38bdf8; }
        .status-bar {
            font-size: 13px;
            color: #94a3b8;
            background: rgba(255,255,255,0.05);
            padding: 4px 14px;
            border-radius: 16px;
            display: inline-block;
        }

        .app-container {
            display: flex;
            gap: 15px;
            width: 95%;
            max-width: 960px;
            justify-content: center;
            align-items: center;
        }

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        #youtubePanel { width: 540px; }
        h3 { margin: 0 0 10px 0; font-size: 15px; color: #f8fafc; }

        .select-box { width: 100%; margin-bottom: 8px; }
        .select-box select {
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #0284c7;
            background: #0f172a;
            color: #38bdf8;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .iframe-box {
            width: 100%;
            height: 270px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }

        #gamePanel { display: none; width: 400px; }

        /* 全螢幕數位健康護眼遮罩 */
        #digitalWellbeingShield {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #090d16;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        canvas {
            background-color: #090d16;
            border: 2px solid #38bdf8;
            border-radius: 6px;
        }
        .btn {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="header-section">
        <h2>🛡️ AIoT 數位健康與應用程式行為干預中樞</h2>
        <div class="status-bar">應用程式監控中... 累積時間: <span id="timerText">0</span> 秒 | n8n 狀態: <span id="n8nStatus">資料已連線</span></div>
    </div>

    <div class="app-container">
        <!-- 主面板 -->
        <div class="panel" id="youtubePanel">
            <h3>📱 數位健康應用程式：YouTube 頻道播放</h3>
            
            <div class="select-box">
                <select id="videoSelect" onchange="playVideo(this.value)">
                    <option value="aqz-KE-bpKQ">01. 🎬 Big Buck Bunny (開源動畫短片)</option>
                    <option value="LXb3EKWsInQ">02. 🌲 4K 大自然森林風景 ASMR</option>
 
                </select>
            </div>

            <div class="iframe-box">
                <!-- 修正預設影片為 aqz-KE-bpKQ 並加上 autoplay=1&mute=1 確保網頁打開即自動自動播放影片 -->
                <iframe id="ytIframe" width="100%" height="270" src="https://www.youtube.com/embed/aqz-KE-bpKQ?autoplay=1&enablejsapi=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <p style="margin: 8px 0 0 0; font-size: 11px; color: #94a3b8;">數位健康計時器已啟動，將在滿限制時間後強制進行行為干預。</p>
        </div>

        <!-- 貪食蛇強制介入區 -->
        <div class="panel" id="gamePanel">
            <h3>🐍 數位健康干預：智慧軌跡貪食蛇</h3>
            <div style="font-size: 13px; margin-bottom: 6px; color: #f43f5e;">⚠️ 超時警告！必須達成 50 分才能解除螢幕鎖定！</div>
            <div style="margin-bottom: 6px; font-size: 13px;">得分: <span id="score">0</span> / 目標: 50 分</div>
            <canvas id="gameCanvas" width="320" height="320"></canvas>
            <button class="btn" onclick="resetGame()">重新挑戰</button>
        </div>
    </div>

    <!-- 達標後的全螢幕數位健康強制護眼遮照 -->
    <div id="digitalWellbeingShield">
        <h1 style="color: #22c55e; font-size: 32px; margin-bottom: 10px;">🌿 數位健康：螢幕使用時間已達上限</h1>
        <p style="font-size: 22px; font-weight: bold; color: #f8fafc; max-width: 600px; line-height: 1.6;">
            您今日的 YouTube 觀看時間已超過 2 小時限制！<br>
            <span style="color: #38bdf8;">請放開鍵盤與螢幕，救救您的眼睛 👀✨</span>
        </p>
        <p style="font-size: 14px; color: #94a3b8; margin-top: 20px;">系統已強制中斷應用程式與影音播放。</p>
        
    </div>

<script>
    let watchSeconds = 0;
    let n8nWebhookUrl = "http://localhost:5678/webhook-test/youtube-timer";

    function playVideo(videoId) {
    const iframe = document.getElementById("ytIframe");
    // 切換影片時同步開啟自動播放
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
}

    const timerInterval = setInterval(() => {
        watchSeconds++;
        document.getElementById("timerText").innerText = watchSeconds;

        if (watchSeconds === 10) {
            sendDataToN8N(watchSeconds);
        }

        if (watchSeconds === 20) {
            triggerLockdown();
        }
    }, 1000);

    function sendDataToN8N(time) {
        document.getElementById("n8nStatus").innerText = "資料已同步至 n8n";
        fetch(n8nWebhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ watchTime: time, user: "PM_User" })
        }).catch(err => console.log("n8n 傳送測試:", err));
    }

    // 強制干預：停止影片並切換貪食蛇
    function triggerLockdown() {
        clearInterval(timerInterval);
        document.getElementById("ytIframe").src = ""; // 切斷聲音與影片播放
        document.getElementById("youtubePanel").style.display = "none";
        document.getElementById("gamePanel").style.display = "flex";
        startGame();
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1, dy = 0;
    let score = 0;
    let gameInterval;

    function startGame() {
        score = 0;
        document.getElementById("score").innerText = score;
        snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
        dx = 1; dy = 0;
        generateFood();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 600);
    }

    function gameLoop() {
        clearCanvas();
        drawFood();
        moveSnake();
        drawSnake();
        checkGameOver();
    }

    function clearCanvas() {
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#38bdf8" : "#0284c7";
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
        });
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById("score").innerText = score;
            generateFood();
            
            // 達到 50 分解鎖目標：啟動全螢幕數位健康黑屏
            if (score >= 50) {
                clearInterval(gameInterval);
                document.getElementById("gamePanel").style.display = "none";
                document.getElementById("digitalWellbeingShield").style.display = "flex";
            }
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
    }

    function drawFood() {
        ctx.fillStyle = "#f43f5e";
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function checkGameOver() {
        const head = snake[0];
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            handleDeath();
        }
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) handleDeath();
        }
    }

    function handleDeath() {
        clearInterval(gameInterval);
        startGame();
    }

    document.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowUp", "ArrowRight", "ArrowDown", " "].includes(event.key)) {
            event.preventDefault();
        }

        if (event.keyCode === 37 && dx === 0) { dx = -1; dy = 0; }
        if (event.keyCode === 38 && dy === 0) { dx = 0; dy = -1; }
        if (event.keyCode === 39 && dx === 0) { dx = 1; dy = 0; }
        if (event.keyCode === 40 && dy === 0) { dx = 0; dy = 1; }
    });

    function resetGame() { startGame(); }
</script>

</body>
</html>
